<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const F = 1 / 30;
const show = (s, t) => tl.set(s, { autoAlpha: 1 }, t);
const hide = (s, t) => tl.set(s, { autoAlpha: 0 }, t);
// palabra: fundido + desenfoque en 3 cuadros (ref: 2-3 cuadros)
const word = (s, t, d = 0.1) => {
  tl.set(s, { display: "inline-block" }, t);
  tl.fromTo(s, { opacity: 0, filter: "blur(12px)" }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "power2.out", immediateRender: false }, t);
};
const flash = (t, a = 0.85, d = 3 * F) => tl.fromTo("#flash", { opacity: a }, { opacity: 0, duration: d, ease: "none", immediateRender: false }, t);

// estados iniciales
gsap.set(["#s2", "#s3", "#s4", "#it1", "#white", "#bar", "#s4dark", "#gframe", "#behind", "#ul", "#blk", "#l2", "#slice", "#gA", "#gB", "#embR", "#embC", "#pa", "#pb"], { autoAlpha: 0 });
gsap.set(["#p2", "#p3", "#p4", "#p5"], { autoAlpha: 0 });

gsap.set(".w", { display: "none" });
gsap.set("#tphoto", { autoAlpha: 0, scale: 0.6 });
gsap.set("#ul", { scaleX: 0 });

// ---------- S1 0.000-0.867 ----------
hide("#f0", 2 * F);
tl.fromTo("#s1in", { scale: 1 }, { scale: 1.04, duration: 0.867, ease: "none" }, 0);
tl.fromTo("#arc", { rotation: -8 }, { rotation: 6, duration: 0.867, ease: "none" }, 0);
tl.fromTo("#bA", { x: -140, y: -90, opacity: 0, filter: "blur(18px)" }, { x: 0, y: 0, opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, 2 * F);
tl.fromTo("#bB", { x: 150, y: -60, opacity: 0, filter: "blur(18px)" }, { x: 0, y: 0, opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, 3 * F);
tl.fromTo("#bC", { y: 160, opacity: 0, filter: "blur(18px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, 4 * F);
tl.to("#tphoto", { autoAlpha: 1, scale: 1, duration: 0.18, ease: "back.out(2)" }, 0.24);
word("#a1", 0.10);
word("#a2", 0.54);
tl.fromTo("#a2", { color: "#C9A24B" }, { color: "#F7F4EC", duration: 0.25, immediateRender: false }, 0.64);
// ráfaga de salida (3 cuadros)
tl.to("#s1in", { filter: "blur(10px) brightness(1.8)", duration: 2 * F, ease: "none" }, 0.80);
hide("#s1", 0.867);

// ---------- S2 0.867-2.067 ----------
show("#s2", 0.867);
flash(0.867, 0.9);
tl.fromTo("#s2in", { filter: "blur(14px)" }, { filter: "blur(0px)", duration: 3 * F, ease: "none", immediateRender: false }, 0.867);
// fotos que cambian cada 2-5 cuadros
const seq = [["#p1", 0.867], ["#p2", 1.033], ["#p3", 1.133], ["#p4", 1.3], ["#p5", 1.4], ["#p1", 1.567], ["#p2", 1.7], ["#p4", 1.8]];
seq.forEach(([p, t], i) => {
  ["#p1", "#p2", "#p3", "#p4", "#p5"].forEach((q) => { if (q !== p) hide(q, t); });
  show(p, t);
  tl.set("#ff", { scale: i % 2 ? 1.12 : 1 }, t);
});
show("#pa", 1.133); hide("#pa", 1.3); show("#pb", 1.4); hide("#pb", 1.567); show("#pa", 1.8);
tl.fromTo("#photos", { scale: 1 }, { scale: 1.03, duration: 1.2, ease: "none" }, 0.867);
word("#b1", 0.86); word("#b2", 1.16); word("#b3", 1.28); word("#b4", 1.40);
tl.to("#t2", { opacity: 0, filter: "blur(8px)", duration: 0.12 }, 1.52);
tl.to("#ff", { opacity: 0, duration: 0.1 }, 1.62);
// "número 1" en cursiva (ref: "this year")
show("#it1", 1.5);
word("#n1", 1.50); word("#n2", 1.70);
hide("#s2", 2.067);

// ---------- S3 2.067-2.633 (glitch 2.067-2.267) ----------
show("#s3", 2.067);
const g = [
  [2.067, { filter: "invert(1) sepia(.9) saturate(1.6)" }, true, 24],
  [2.1, { filter: "none" }, false, -36],
  [2.133, { filter: "invert(1) sepia(.9) saturate(1.6)" }, true, 0],
  [2.167, { filter: "contrast(1.4)" }, true, 30],
  [2.2, { filter: "none" }, false, 0],
  [2.233, { filter: "brightness(1.3)" }, true, -18],
  [2.267, { filter: "none" }, false, 0],
];

  tl.set("#s3in", f, t);
  tl.set(["#gA", "#gB"], { autoAlpha: split ? 0.75 : 0 }, t);
  tl.set("#gA", { x: split ? 18 : 0 }, t);
  tl.set("#gB", { x: split ? -18 : 0 }, t);
  tl.set("#slice", { autoAlpha: dx ? 1 : 0, x: dx }, t);
  tl.set("#it1", { x: dx ? -dx * 0.6 : 0 }, t);
