<script>
// ===== variables fáciles de cambiar =====
const DIA = 5;            // día por calendario (Día 1 = 7 oct). El 11 oct = Día 5 y él lo dice en cámara.
const DE = 42;
// ===== datos generados (EDL + palabras) =====
const D = __DATA__;
const S = (id) => D.edl[id].start, EN = (id) => D.edl[id].end;
const w = (id, i) => D.words[id][i];
const F = 1 / 30, LEAD = 2 * F;   // títulos: onset de voz - 2 cuadros
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const show = (s, t) => tl.set(s, { autoAlpha: 1 }, t);
const hide = (s, t) => tl.set(s, { autoAlpha: 0 }, t);
const inBlur = (s, t, d = 3 * F, px = 14) => tl.fromTo(s, { autoAlpha: 0, filter: `blur(${px}px)` }, { autoAlpha: 1, filter: "blur(0px)", duration: d, ease: "power2.out", immediateRender: false }, t);
const outBlur = (s, t, d = 3 * F) => tl.to(s, { autoAlpha: 0, filter: "blur(10px)", duration: d, ease: "power1.in" }, t);
const esc = (x) => x.replace(/&/g, "&amp;").replace(/</g, "&lt;");
// texto con marcas: *clave* (dorado), ~serif~ (Playfair grande), _tachado_ ; '|' = salto de línea
function rich(t) {
  return t.split("|").map((ln) => '<span class="ln">' + esc(ln)
    .replace(/~([^~]+)~/g, '<span class="s">$1</span>')
    .replace(/\*([^*]+)\*/g, '<span class="k">$1</span>')
    .replace(/_([^_]+)_/g, '<span class="x">$1<i></i></span>') + "</span>").join("");
}
// ---------- subtítulos por tarjeta (2-4 palabras, fundido + desenfoque 2 cuadros, salida seca) ----------
let capN = 0;
function card(text, t0, t1) {
  const el = document.createElement("div"); el.className = "cap"; el.id = "cap" + (capN++); el.innerHTML = rich(text);
  document.getElementById("caps").appendChild(el);
  gsap.set(el, { autoAlpha: 0 });
  tl.fromTo(el, { autoAlpha: 0, filter: "blur(8px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 2 * F, ease: "power2.out", immediateRender: false }, t0 - LEAD);
  el.querySelectorAll(".x i").forEach((i) => { gsap.set(i, { scaleX: 0 }); tl.to(i, { scaleX: 1, duration: 0.22, ease: "power2.out" }, t0 + 0.35); });
  tl.set(el, { autoAlpha: 0 }, t1 - LEAD);
  return el;
}
// ---------- títulos cinéticos: palabras en su sitio final, entran con desenfoque + subida (serif además escala 0,6->1) ----------
function kin(box, lines, cls) {
  const el = document.getElementById(box);
  el.innerHTML = lines.map((ln) => '<span class="ln">' + ln.map((wd) => `<span class="w${wd.c ? " " + wd.c : ""}">${esc(wd.t)}</span>`).join(" ") + "</span>").join("");
  const spans = el.querySelectorAll(".w"); let k = 0;
  lines.forEach((ln) => ln.forEach((wd) => {
    const sp = spans[k++]; const serif = (wd.c || "").includes("s") || (wd.c || "").includes("k");
    if (wd.at <= 0.001) { gsap.set(sp, { autoAlpha: 1 }); return; }   // palabra del cuadro 0: ya visible
    gsap.set(sp, { autoAlpha: 0 });
    tl.fromTo(sp, { autoAlpha: 0, y: 22, filter: "blur(10px)", scale: serif ? 0.6 : 1 },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", scale: 1, duration: (serif ? 7 : 5) * F, ease: "power2.out", immediateRender: false }, Math.max(0, wd.at - LEAD));
  }));
  return el;
}
const W_ = (t, id, i, c) => ({ t, at: w(id, i), c });

// ============ 1. GANCHO (0 - 4,18): persona + título cinético grande; el primer cuadro ya tiene texto ============

inBlur("#pltag", S("PL") + 0.85, 6 * F, 10);

// ---------- grano de papel (cada 2 cuadros) ----------
const NG = Math.ceil(D.total / (2 * F));
for (let i = 0; i < NG; i++) tl.set("#grain", { x: ((i * 73) % 180) - 90, y: ((i * 131) % 180) - 90 }, i * 2 * F);
tl.set({}, {}, D.total);
window.__timelines["main"] = tl;
