<template id="graphics-template">
  <!--
    Subtítulos cinéticos (estilo aprobado por el usuario) + escenas a pantalla
    completa (FS). El bloque CAPS lo rellena scripts/make_caps.py desde
    build/words_out.json. Ejemplo completo de 6 escenas: ../examples/graphics_dia1.html
  -->
  <div data-composition-id="graphics" data-width="1080" data-height="1920" data-duration="__DUR__">
    <div id="caps"></div>

    <!-- EJEMPLO de escena FS (fondo negro + glow rojo + palabra clave). Duplicar por escena. -->
    <div id="s1" class="scene dark">
      <div class="glow"></div>
      <div id="s1-a" class="t-white t-mid" style="top: 640px">palabra previa</div>
      <div id="s1-b" class="t-red t-huge glowtxt" style="top: 740px">CLAVE</div>
    </div>

    <style>
      [data-composition-id="graphics"] {
        background: transparent; font-family: "Inter", sans-serif; overflow: hidden;
        --red: #e3120b; --cream: #f2eee8; --dark: #141414; --gray: #8a8784;
      }
      .scene { position: absolute; inset: 0; z-index: 10; visibility: hidden; overflow: hidden; }
      .dark { background: #070707; }
      .cream { background-color: var(--cream);
        background-image: linear-gradient(rgba(0,0,0,.035) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,.035) 2px, transparent 2px);
        background-size: 72px 72px; }
      .glow { position: absolute; left: 50%; top: 46%; width: 1300px; height: 1300px; transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(227,18,11,.28) 0%, rgba(227,18,11,.08) 38%, transparent 66%); }
      .t-white, .t-gray, .t-dark, .t-red { position: absolute; left: 0; width: 100%; text-align: center; letter-spacing: -0.03em; line-height: 1; }
      .t-white { color: #fff; } .t-gray { color: var(--gray); font-weight: 500; } .t-dark { color: var(--dark); }
      .t-red { color: var(--red); font-weight: 900; }
      .t-mid { font-size: 68px; font-weight: 600; } .t-huge { font-size: 180px; letter-spacing: -0.045em; }
      .glowtxt { text-shadow: 0 0 40px rgba(227,18,11,.75), 0 0 90px rgba(227,18,11,.45); }
      /* glow sobre algo recortado con overflow:hidden → filter: drop-shadow() en el CONTENEDOR */

      #caps { position: absolute; inset: 0; z-index: 5; }
      .cap { position: absolute; left: 100px; width: 880px; top: 1170px; text-align: center; visibility: hidden; line-height: 1.08; }
      .cap .w { display: inline-block; margin: 0 0.12em; color: #151515; font-size: 74px; font-weight: 700; letter-spacing: -0.03em;
        text-shadow: 0 0 22px rgba(255,255,255,.95), 0 0 6px rgba(255,255,255,.9); }
      .cap .w.kw { color: var(--red); font-size: 104px; font-weight: 900; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      // Frases: { a: inicio, b: fin, w: [[palabra, t, esClave]] }. Solo tramos de cabeza hablando.
      /*CAPS*/
      const CAPS = [];
      /*END CAPS*/

      const capsEl = document.getElementById("caps");
      CAPS.forEach((c, i) => {
        const d = document.createElement("div");
        d.className = "cap"; d.id = "cap" + i;
        c.w.forEach(([txt, , kw], j) => {
          const s = document.createElement("span");
          s.className = "w" + (kw ? " kw" : ""); s.id = `cap${i}w${j}`; s.textContent = txt;
          d.appendChild(s);
        });
        capsEl.appendChild(d);
      });

      const tl = gsap.timeline({ paused: true });
      const show = (s, t) => tl.set(s, { visibility: "visible" }, t);
      const hide = (s, t) => tl.set(s, { visibility: "hidden" }, t);
      const blurIn = (s, t, x = {}) => tl.fromTo(s, { opacity: 0, y: 26, scale: 0.92, filter: "blur(14px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "power3.out", ...x }, t);
      const slam = (s, t, from = 1.5) => tl.fromTo(s, { opacity: 0, scale: from, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.34, ease: "expo.out" }, t);

      // Subtítulos: palabra a palabra con blur-in; clave con pop; la frase sale hacia arriba
      CAPS.forEach((c, i) => {
        show("#cap" + i, c.a);
        c.w.forEach(([, t, kw], j) => {
          const s = `#cap${i}w${j}`;
          if (kw) tl.fromTo(s, { opacity: 0, scale: 1.45, filter: "blur(12px)" },
            { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "back.out(2)" }, t);
          else blurIn(s, t, { duration: 0.24 });
        });
        tl.to("#cap" + i, { opacity: 0, y: -24, filter: "blur(8px)", duration: 0.14, ease: "power2.in" }, c.b - 0.14);
        hide("#cap" + i, c.b);
      });

      // EJEMPLO de escena FS con salida en iris (círculo que se cierra y revela el video)
      gsap.set("#s1", { clipPath: "circle(150% at 50% 42%)" });
      show("#s1", 10.0);
      blurIn("#s1-a", 10.05);
      slam("#s1-b", 10.4, 1.7);
      tl.to("#s1", { clipPath: "circle(0% at 50% 42%)", duration: 0.3, ease: "power3.in" }, 11.6);
      hide("#s1", 11.9);
      // OJO: hijos con visibility:"visible" ignoran el hidden del padre → ocultarlos también al salir.

      window.__timelines = window.__timelines || {};
      window.__timelines["graphics"] = tl;
    </script>
  </div>
</template>
