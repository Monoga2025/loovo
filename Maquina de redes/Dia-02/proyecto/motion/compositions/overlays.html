<template id="overlays-template">
  <!--
    Mosaicos de icono vectorial (Phosphor, MIT) y un billete real tintado de rojo (dominio público, Wikimedia Commons)
    sobre la cabeza hablando, a la izquierda de la cara. Entrada con giro 3D, flotación y salida con giro.
  -->
  <div data-composition-id="overlays" data-width="1080" data-height="1920" data-duration="63.100000">
    <div id="stk-layer"></div>

    <style>
      [data-composition-id="overlays"] { background: transparent; overflow: hidden; }
      #stk-layer { position: absolute; inset: 0; }
      .stk { position: absolute; visibility: hidden; }
      .stk .tile { position: absolute; inset: 0; border-radius: 26%; background: linear-gradient(150deg, #ffffff 0%, #ecebe8 100%);
        border: 4px solid #e3120b; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 24px 40px rgba(0,0,0,.4), 0 0 36px rgba(227,18,11,.55), inset 0 -7px 0 rgba(0,0,0,.05); }
      .stk .tile img { width: 58%; height: 58%; display: block; }
      .stk img.bill { width: 100%; height: auto; display: block; border-radius: 8px; filter: drop-shadow(0 22px 26px rgba(0,0,0,.55)); }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      // i = icono Phosphor (assets/ico/<i>_r.svg). bill = billete tintado. Todo a la izquierda (x 62): la cabeza queda a la derecha.
      const STK = [
        { t0: 1.30, t1: 2.35, bill: 1, y: 470, w: 340, r: -16 },                    // no le pago
        { t0: 2.42, t1: 3.06, i: "alarm-fill", y: 560, s: 210, r: -10 },             // las 3 de la mañana
        { t0: 5.80, t1: 6.60, i: "calendar-star-fill", y: 480, s: 210, r: 8 },       // hasta llegar al evento
        { t0: 7.76, t1: 8.95, i: "robot-fill", y: 360, s: 210, r: -8 },              // agencia de inteligencia artificial
        { t0: 8.30, t1: 9.40, i: "brain-fill", y: 640, s: 210, r: 10 },              // inteligencia artificial
        { t0: 17.20, t1: 18.20, i: "film-slate-fill", y: 500, s: 210, r: -8 },       // con este estilo
        { t0: 18.40, t1: 19.60, i: "fire-fill", y: 420, s: 210, r: -8 },             // lo exploto
        { t0: 19.45, t1: 20.60, i: "moon-stars-fill", y: 640, s: 210, r: 12 },       // toda la noche
        { t0: 21.20, t1: 21.95, i: "bed-fill", y: 520, s: 210, r: -8 },              // durmiendo
        { t0: 22.80, t1: 23.60, i: "lightning-fill", y: 420, s: 210, r: 10 },        // sobreexplotó
        { t0: 24.30, t1: 25.40, i: "sun-fill", y: 560, s: 210, r: -6 },              // trabaja en el día
        { t0: 26.00, t1: 26.50, i: "address-book-fill", y: 480, s: 210, r: 8 },      // mi CRM
        { t0: 28.20, t1: 29.30, i: "address-book-fill", y: 420, s: 210, r: -8 },     // CRM real
        { t0: 29.25, t1: 30.95, i: "cpu-fill", y: 640, s: 210, r: 10 },              // inteligencia artificial integrada
        { t0: 31.75, t1: 33.20, i: "chat-circle-dots-fill", y: 520, s: 210, r: -10 },// chat pegado
        { t0: 37.60, t1: 38.60, i: "plugs-connected-fill", y: 480, s: 210, r: -12 }, // este CRM
        { t0: 46.95, t1: 48.40, i: "robot-fill", y: 520, s: 210, r: -8 },            // nacido una inteligencia artificial
        { t0: 49.70, t1: 50.45, i: "address-book-fill", y: 420, s: 210, r: 8 },      // con un CRM
        { t0: 51.50, t1: 52.60, i: "lightbulb-fill", y: 540, s: 210, r: -6 },        // es bueno con IA
        { t0: 57.90, t1: 58.75, i: "chats-circle-fill", y: 480, s: 210, r: 8 },      // quiero que me digas
        { t0: 59.80, t1: 60.70, i: "link-fill", y: 380, s: 210, r: -8 },             // esclavizar
        { t0: 60.10, t1: 61.20, i: "moon-fill", y: 640, s: 210, r: 10 },             // durante toda la noche
        { t0: 61.30, t1: 62.30, i: "sun-fill", y: 520, s: 210, r: -10 },             // todos los días
      ];

      const layer = document.getElementById("stk-layer");
      STK.forEach((k, i) => {
        const d = document.createElement("div");
        d.className = "stk"; d.id = "stk" + i;
        const w = k.bill ? k.w : k.s;
        d.style.width = w + "px"; d.style.left = "62px"; d.style.top = k.y + "px";
        if (k.bill) {
          d.style.height = Math.round(w * 0.42) + "px";
          const im = document.createElement("img");
          im.className = "bill"; im.src = "assets/note_red.png"; im.id = "stkimg" + i;
          d.appendChild(im);
        } else {
          d.style.height = k.s + "px";
          const t = document.createElement("div"); t.className = "tile"; t.id = "stkimg" + i;
          const im = document.createElement("img"); im.src = `assets/ico/${k.i}_r.svg`;
          t.appendChild(im); d.appendChild(t);
        }
        layer.appendChild(d);
      });

      const tl = gsap.timeline({ paused: true });
      STK.forEach((k, i) => {
        const w = "#stk" + i, m = "#stkimg" + i;
        tl.set(w, { visibility: "visible" }, k.t0);
        tl.fromTo(w, { scale: 0, y: 40, opacity: 0, rotation: k.r * 3 },
          { scale: 1, y: 0, opacity: 1, rotation: k.r, duration: 0.5, ease: "back.out(1.9)", immediateRender: false }, k.t0);
        tl.fromTo(m, { rotationY: 170, transformPerspective: 700 },
          { rotationY: 0, transformPerspective: 700, duration: 0.6, ease: "power3.out", immediateRender: false }, k.t0);
        const idle0 = k.t0 + 0.55, idle1 = k.t1 - 0.25;
        if (idle1 > idle0) {
          tl.to(w, { y: -16, rotation: k.r - 5, duration: Math.max(idle1 - idle0, 0.2), ease: "sine.inOut" }, idle0);
          tl.to(m, { rotationY: -16, transformPerspective: 700, duration: Math.max(idle1 - idle0, 0.2), ease: "sine.inOut" }, idle0);
        }
        tl.to(w, { scale: 0, opacity: 0, duration: 0.22, ease: "power2.in" }, k.t1 - 0.22);
        tl.to(m, { rotationY: -140, transformPerspective: 700, duration: 0.22, ease: "power2.in" }, k.t1 - 0.22);
        tl.set(w, { visibility: "hidden" }, k.t1);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["overlays"] = tl;
    </script>
  </div>
</template>
