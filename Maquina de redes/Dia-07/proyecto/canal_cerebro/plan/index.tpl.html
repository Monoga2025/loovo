// ============ H. GANCHO 0 -> cut1: "cerebro" ya está en el cuadro 0 ============

const HN = [["file-text", 70, 520, 0], ["folder", 40, 730, 1], ["database", 70, 940, 0], ["books", 860, 520, 1], ["graph", 890, 730, 0], ["table", 860, 940, 1]];

$("#hSvg").innerHTML = HN.map(([, x, y], i) => `<polyline id="hl${i}" points="${x + 75},${y + 75} ${x < 540 ? 230 : 850},${y + 75} 540,825" fill="none" stroke="#C8B07A" stroke-width="5" stroke-linejoin="miter"/>`).join("");
HN.forEach((n, i) => {
  const t = 0.05 + i * ((B.h_nb - 0.2) / HN.length);
  if (i < 2) gsap.set("#hn" + i, { autoAlpha: 1 });   // dos nodos ya en el cuadro 0

});

hide("#sH", B.cut1);

// ============ C1. pantalla: la carpeta donde tengo todo (2.5D) ============

hide("#shade", B.f_in);

// ============ F. carpeta -> resumen.md -> NotebookLM ============
enterMG("#sF", "#camF", B.f_in, B.u_in);
T("#fT", ["le dije al ~agente~", "que hiciera", "un *resumen*"], "C2a", { min: B.f_in });
gsap.set(["#fAg", "#fDoc", "#fNb", "#fScan"], { autoAlpha: 0 });
tl.fromTo("#fAg", { autoAlpha: 0, scale: 0.3, rotation: -30 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.4, ease: "back.out(1.7)", immediateRender: false }, B.f_age - 0.1);

$("#fTiles").innerHTML = FI.map((ic, i) => `<div class="ft" id="ft${i}" style="left:${105 + (i % 4) * 230}px;top:${790 + Math.floor(i / 4) * 175}px"><div class="ico" style="${ICON(ic)}"></div></div>`).join("");
gsap.set(".ft", { autoAlpha: 0 });
FI.forEach((_, i) => tl.fromTo("#ft" + i, { autoAlpha: 0, y: 120, scale: 0.6, filter: "blur(8px)" }, { autoAlpha: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out", immediateRender: false }, B.f_in + 0.15 + i * 0.045));
gsap.set("#fScan", { top: 780 });
tl.set("#fScan", { autoAlpha: 1 }, B.f_age + 0.1);
tl.to("#fScan", { y: 700, duration: B.f_res - B.f_age - 0.1, ease: "none" }, B.f_age + 0.1);
FI.forEach((_, i) => tl.to(`#ft${i} .ico`, { backgroundColor: "#A88F57", duration: 2 * F }, B.f_age + 0.1 + (Math.floor(i / 4) * 175 / 700) * (B.f_res - B.f_age - 0.1)));
tl.set("#fScan", { autoAlpha: 0 }, B.f_res);
// todo se comprime en un solo documento
FI.forEach((_, i) => tl.to("#ft" + i, { x: 540 - (105 + (i % 4) * 230) - 75, y: 1020 - (790 + Math.floor(i / 4) * 175) - 75, scale: 0.2, rotation: R(-90, 90), autoAlpha: 0, duration: 0.42, ease: "power3.in" }, B.f_res + i * 0.012));

tl.to("#fDoc", { scale: 1.06, duration: 3 * F, yoyo: true, repeat: 1, ease: "power2.out" }, B.f_md);
