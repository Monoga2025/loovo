shake("#camE", B.e_peor + F, 16, 6);
tl.to("#camE", { scale: 1.06, duration: 0.25, ease: "power3.out", yoyo: true, repeat: 1 }, B.e_fun);

tl.set("#base", { filter: "blur(0px)", scale: 1 }, B.i_in + 0.05);

const iw = $("#iWord"); iw.innerHTML = [..."ODOO"].map((c) => `<span class="ch" style="display:inline-block">${c}</span>`).join("");
gsap.set("#iWord", { autoAlpha: 1 }); gsap.set("#iWord .ch", { autoAlpha: 0 });
tl.fromTo("#iWord .ch", { autoAlpha: 0, y: 140, rotationX: -90, transformPerspective: 1200 }, { autoAlpha: 1, y: 0, rotationX: 0, duration: 0.4, ease: "expo.out", stagger: 0.06, immediateRender: false }, B.i_odoo - 0.2);
inBlur(["#iTrack", "#iLbl"], B.i_ins - 0.1);

whip("#camI", "#sI", "#sK", "#camK", B.k_in, 0, 900, B.q_in);
T("#kT", ["el módulo de", "~marketing~"], ["P3a", "P3b"], { min: B.k_in });
keybox("#kKb", B.k_kan, 700);
gsap.set(".col", { autoAlpha: 0 });
[0, 1, 2].forEach((i) => tl.fromTo("#kc" + i, { autoAlpha: 0, y: 300, filter: "blur(12px)" }, { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out", immediateRender: false }, B.k_kan - 0.25 + i * 0.1));
const KC = [[0, 0], [0, 1], [0, 2], [0, 3], [1, 0], [2, 0]];
$("#kCards").innerHTML = KC.map(([c, r], i) => `<div class="kc" id="kk${i}" style="left:${80 + c * 330}px;top:${880 + r * 140}px"><b></b><i style="top:30px;width:${R(140, 210)}px"></i><i style="top:66px;width:${R(90, 170)}px;background:#8C887F"></i></div>`).join("");
gsap.set(".kc", { autoAlpha: 0 });
KC.forEach((_, i) => tl.fromTo("#kk" + i, { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, B.k_kan + 0.25 + i * 0.07));
// al decir "organizar" y "guiones": las tarjetas cruzan de columna
tl.to("#kk1", { x: 330, y: 140, rotation: 3, duration: 0.5, ease: "expo.inOut" }, B.k_org - 0.1);
tl.to("#kk2", { x: 330, y: 140, duration: 0.5, ease: "expo.inOut" }, B.k_org + 0.15);
tl.to("#kk4", { x: 330, y: 420 - 0, duration: 0.5, ease: "expo.inOut" }, B.k_gui - 0.3);
tl.to(".kc b", { backgroundColor: "#A88F57", duration: 3 * F, stagger: 0.05 }, B.k_gui);
tl.to("#kT", { autoAlpha: 0, y: -40, filter: "blur(10px)", duration: 4 * F }, B.k_kan - 0.6);
const KT2 = document.createElement("div"); KT2.className = "ttl dk f90"; KT2.id = "kT2"; KT2.style.top = "150px"; $("#camK").appendChild(KT2);
T("#kT2", ["para organizar", "los ~guiones~"], "P3b", { min: B.k_org - 0.4 });
tl.to("#kKb", { autoAlpha: 0, duration: 3 * F }, B.k_org - 0.4);

// ============ Q. "¿Saben qué pasa?" ============
whip("#camK", "#sK", "#sQ", "#camQ", B.q_in, 1000, 0, B.cut2);

shake("#camQ", B.q_pasa, 10, 4);

hide(["#sO", "#shade"], B.l_in);

shake("#sD", B.d_dian2 + F, 10, 4);
baseOut(B.r_in, 0.3, 1.5);
hide(["#sD", "#shade"], B.r_in);

tl.fromTo("#yStamp", { autoAlpha: 0, scale: 2.6, rotation: -24 }, { autoAlpha: 1, scale: 1, rotation: -7, duration: 4 * F, ease: "power4.in", immediateRender: false }, B.y_exi - 4 * F);

// ============ placa del canal ============
destello(B.pl, ["#sY", "#shade"]);
show("#pl", B.pl);
gsap.set(["#plL", "#plS", "#plT"], { autoAlpha: 0 }); gsap.set("#plH", { scaleX: 0 });
tl.fromTo("#plL", { autoAlpha: 0, y: 30, scale: 1.12, filter: "blur(14px)" }, { autoAlpha: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 10 * F, ease: "power2.out", immediateRender: false }, B.pl + 0.10);
tl.to("#plH", { scaleX: 1, duration: 0.45, ease: "sine.inOut" }, B.pl + 0.35);
tl.fromTo("#plS", { autoAlpha: 0, scale: 0.7, filter: "blur(14px)" }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 9 * F, ease: "power2.out", immediateRender: false }, B.pl + 0.45);
inBlur("#plT", B.pl + 0.8, 6 * F, 10);
tl.fromTo("#pl", { scale: 1 }, { scale: 1.03, duration: D.total - B.pl, ease: "sine.out", immediateRender: false }, B.pl);

const NG = Math.ceil(D.total / (2 * F));
for (let i = 0; i < NG; i++) tl.set("#grain", { x: ((i * 73) % 180) - 90, y: ((i * 131) % 180) - 90 }, i * 2 * F);
tl.set({}, {}, D.total);
window.__timelines["main"] = tl;
