<template id="behind-template">
  <!--
    Palabras gigantes DETRÁS del hablante (capa entre #base y la silueta).
    Reglas aprendidas:
    - Solo palabras que el hablante DICE (nada de sinónimos tipo "JUNTOS" por "acompañen").
    - Arriba, sobre la pared, con el borde inferior por encima de la coronilla
      en ESE tramo (la cabeza sube con cada punch-in/zoom). Verificar en snapshots.
    - Una sola línea; dos líneas suelen quedar tapadas por la cabeza.
    - Evitar puntuación pequeña donde pasa el pelo ("2.000" se leía "2,000" →
      usar "+2 MIL").
    - Si en un tramo la cabeza llega al borde superior, NO poner palabra ahí.
  -->
  <div data-composition-id="behind" data-width="1080" data-height="1920" data-duration="__DUR__">
    <div id="bw"></div>
    <style>
      [data-composition-id="behind"] { background: transparent; font-family: "Inter", sans-serif; overflow: hidden; }
      .bword {
        position: absolute; left: 0; width: 100%; text-align: center; visibility: hidden;
        font-weight: 900; letter-spacing: -0.055em; line-height: 0.86; color: #151515;
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.12);
      }
      .bword.red { color: #e3120b; text-shadow: 0 8px 40px rgba(227, 18, 11, 0.25); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      // [texto, aparece (s), desaparece (s), tamaño px, top px, rojo?] — tiempos de build/words_out.json
      const WORDS = [
        ["EJEMPLO", 2.2, 3.0, 230, 300, 0],
        ["CLAVE", 3.0, 3.9, 260, 285, 1],
      ];
      const host = document.getElementById("bw");
      WORDS.forEach(([txt, , , size, top, red], i) => {
        const d = document.createElement("div");
        d.className = "bword" + (red ? " red" : "");
        d.id = "bw" + i;
        d.textContent = txt;
        d.style.fontSize = size + "px";
        d.style.top = top + "px";
        host.appendChild(d);
      });
      const tl = gsap.timeline({ paused: true });
      WORDS.forEach(([, a, b], i) => {
        const el = "#bw" + i;
        tl.set(el, { visibility: "visible" }, a);
        tl.fromTo(el, { opacity: 0, y: 140, scale: 0.9, filter: "blur(18px)" },
          { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out" }, a);
        tl.to(el, { y: -26, duration: Math.max(b - a - 0.6, 0.1), ease: "none" }, a + 0.42); // deriva/parallax
        tl.to(el, { opacity: 0, y: -90, filter: "blur(14px)", duration: 0.18, ease: "power2.in" }, b - 0.18);
        tl.set(el, { visibility: "hidden" }, b);
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["behind"] = tl;
    </script>
  </div>
</template>
