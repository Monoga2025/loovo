<template id="tecnicas-template">
  <!-- Catálogo de técnicas aprendidas de 10 referencias de Pinterest (Día 2, ronda 7), en marca IA MONOGA.
       Cada escena es una técnica autocontenida; copia la que necesites a graphics.html y cambia el texto
       por palabras literales del usuario. Tiempos de esta demo: ver ESCENAS abajo. -->
  <div data-composition-id="tecnicas" data-width="1080" data-height="1920" data-duration="22">
    <style>
      @font-face { font-family: "SG"; font-weight: 700; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "SG"; font-weight: 500; src: url("assets/fonts/space-grotesk-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "IS"; font-style: italic; font-weight: 400; src: url("assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); }
      [data-composition-id="tecnicas"] { background: #0B0B0F; overflow: hidden; }
      .sc { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
      .dark { background: #0B0B0F; }
      .light { background: #F4F2EE; }
      .grid-d { position: absolute; inset: -90px; background-image:
          linear-gradient(rgba(47,91,255,.22) 2px, transparent 2px), linear-gradient(90deg, rgba(47,91,255,.22) 2px, transparent 2px);
        background-size: 90px 90px; }
      .grid-l { position: absolute; inset: -90px; background-image:
          linear-gradient(rgba(11,11,15,.08) 2px, transparent 2px), linear-gradient(90deg, rgba(11,11,15,.08) 2px, transparent 2px);
        background-size: 90px 90px; }
      .aura { position: absolute; width: 1400px; left: -160px; top: 300px; opacity: .55; }
      .grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .07; mix-blend-mode: overlay; pointer-events: none; z-index: 50; }
      .h { font-family: "SG", sans-serif; font-weight: 700; letter-spacing: -0.05em; line-height: .88; white-space: nowrap; }
      .s { font-family: "IS", serif; font-style: italic; font-weight: 400; white-space: nowrap; }
      .ui { font-family: "SG", sans-serif; font-weight: 500; white-space: nowrap; }
      .abs { position: absolute; }
      .center { left: 0; width: 100%; text-align: center; }
      .ic { display: block; background: currentColor; -webkit-mask: var(--i) center/contain no-repeat; mask: var(--i) center/contain no-repeat; }
    </style>

    <!-- T1 · Arco que se dibuja alrededor del objeto + titular por fragmentos (ref #1 Liquid Death) -->
    <div class="sc dark" id="s1">
      <div class="grid-d"></div>
      <img class="aura" src="assets/tex/aura.png">
      <svg class="abs" id="s1arc" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0">
        <circle id="s1c" cx="540" cy="1130" r="400" fill="none" stroke="#2F5BFF" stroke-width="6" stroke-dasharray="2513" stroke-dashoffset="2513" stroke-linecap="round"/>
        <circle id="s1d" cx="540" cy="1130" r="455" fill="none" stroke="#C6FF3D" stroke-width="5" stroke-dasharray="2 22" stroke-linecap="round" opacity="0"/>
      </svg>
      <img class="abs" id="s1phone" src="assets/foto/celular_corte.png" style="width:470px;left:305px;top:760px;filter:drop-shadow(0 50px 60px rgba(0,0,0,.6))">
      <div class="abs center" style="top:330px">
        <span class="h" id="s1a" style="font-size:150px;color:#F4F2EE;display:inline-block">TU&nbsp;</span><span class="h" id="s1b" style="font-size:150px;color:#C6FF3D;display:inline-block">EMPLEADO</span>
      </div>
      <div class="abs center s" id="s1e" style="top:500px;font-size:96px;color:#F4F2EE">que no duerme</div>
    </div>

    <!-- T3 · Placa clara + palabra que crece hasta tocar el borde y corte duro (ref #3, #7) -->
    <div class="sc light" id="s2">
      <div class="grid-l"></div>
      <div class="abs center s" id="s2a" style="top:640px;font-size:110px;color:#0B0B0F">todo lo demás es</div>
      <div class="abs center h" id="s2b" style="top:820px;font-size:300px;color:#2F5BFF">RUIDO</div>
    </div>

    <!-- T4 · Contador rueda 90 → 100 en < 1 s + línea que se dibuja (ref #7) -->
    <div class="sc dark" id="s3">
      <div class="grid-d"></div>
      <div class="abs" id="s3win" style="left:70px;top:700px;width:640px;height:330px;overflow:hidden">
        <div id="s3strip"></div>
      </div>
      <div class="abs h" id="s3u" style="left:730px;top:790px;font-size:150px;color:#F4F2EE">DÍAS</div>
      <svg class="abs" width="1080" height="200" viewBox="0 0 1080 200" style="left:0;top:1060px">
        <path id="s3line" d="M140 60 C 380 140, 620 0, 940 70" fill="none" stroke="#2F5BFF" stroke-width="12" stroke-linecap="round" stroke-dasharray="900" stroke-dashoffset="900"/>
      </svg>
      <div class="abs center s" id="s3s" style="top:1240px;font-size:84px;color:#8C8C99">y contando</div>
    </div>

    <!-- T5 · Marco fijo, el contenido cambia con cada golpe (ref #5, #6, #9) -->
    <div class="sc dark" id="s4">
      <div class="grid-d"></div>
      <div class="abs" id="s4card" style="left:170px;top:480px;width:740px;height:960px;border-radius:56px;overflow:hidden;
           box-shadow:0 0 0 6px #2F5BFF,0 60px 90px rgba(0,0,0,.6)">
        <img class="abs" id="s4p0" src="assets/foto/cohete_duo.png" style="inset:0;width:100%;height:100%;object-fit:cover">
        <img class="abs" id="s4p1" src="assets/foto/satelite_duo.png" style="inset:0;width:100%;height:100%;object-fit:cover;opacity:0">
        <img class="abs" id="s4p2" src="assets/foto/servidores_duo.png" style="inset:0;width:100%;height:100%;object-fit:cover;opacity:0">
        <div class="abs" id="s4fl" style="inset:0;background:#F4F2EE;opacity:0"></div>
      </div>
      <div class="abs" id="s4tag" style="left:110px;top:1360px;width:470px;height:124px;background:#C6FF3D;color:#0B0B0F;padding:18px 34px;border-radius:18px;transform:rotate(-2deg)">
        <span class="h" id="s4t0" style="font-size:88px">IDEA</span><span class="h abs" id="s4t1" style="font-size:88px;left:34px;top:18px;opacity:0">GRABA</span><span class="h abs" id="s4t2" style="font-size:88px;left:34px;top:18px;opacity:0">PUBLICA</span>
      </div>
    </div>

    <!-- T6 · Tarjeta pequeña y desenfocada que se asienta, renglones escalonados y expansión que ocluye (ref #2, #10) -->
    <div class="sc dark" id="s5">
      <div class="grid-d"></div>
      <img class="aura" src="assets/tex/aura.png" style="top:500px">
      <div class="abs" id="s5card" style="left:140px;top:620px;width:800px;height:680px;border-radius:44px;background:#F4F2EE;
           box-shadow:0 50px 80px rgba(0,0,0,.55)">
        <div class="abs h" style="left:60px;top:60px;font-size:96px;color:#0B0B0F">Valor</div>
        <div class="abs" id="s5r0" style="left:60px;top:230px;width:560px;height:44px;border-radius:22px;background:#2F5BFF"></div>
        <div class="abs" id="s5r1" style="left:60px;top:320px;width:640px;height:44px;border-radius:22px;background:#0B0B0F"></div>
        <div class="abs" id="s5r2" style="left:60px;top:410px;width:420px;height:44px;border-radius:22px;background:#0B0B0F"></div>
        <div class="abs" id="s5r3" style="left:60px;top:500px;width:520px;height:44px;border-radius:22px;background:#C6FF3D"></div>
      </div>
      <div class="abs center h" id="s5t" style="top:1420px;font-size:120px;color:#C6FF3D;z-index:5">NO RUIDO</div>
    </div>

    <!-- T8 · Vista explotada 2.5D: capas que se separan en profundidad y vuelven (ref #8 Sony) -->
    <div class="sc dark" id="s6">
      <div class="grid-d"></div>
      <div class="abs" id="s6stage" style="left:240px;top:900px;width:600px;height:600px;perspective:2200px;perspective-origin:50% 50%">
        <div id="s6tilt" style="position:absolute;inset:0;transform-style:preserve-3d">
        <div id="s6stack" style="position:absolute;inset:0;transform-style:preserve-3d">
          <div class="abs s6l" id="s6l0" style="inset:0;border-radius:60px;background:#15151c;box-shadow:0 0 0 5px #2F5BFF"></div>
          <div class="abs s6l" id="s6l1" style="inset:40px;border-radius:40px;background:linear-gradient(160deg,#2F5BFF,#0B0B0F)"></div>
          <div class="abs s6l" id="s6l2" style="left:90px;top:90px;width:420px;height:120px;border-radius:24px;background:#F4F2EE"></div>
          <div class="abs s6l" id="s6l3" style="left:90px;top:250px;width:300px;height:120px;border-radius:24px;background:#F4F2EE"></div>
          <div class="abs s6l" id="s6l4" style="left:380px;top:380px;width:150px;height:150px;border-radius:50%;background:#C6FF3D;color:#0B0B0F;display:flex;align-items:center;justify-content:center">
            <i class="ic" style="--i:url(assets/ico/check-bold.svg);width:90px;height:90px"></i>
          </div>
        </div>
      </div>
        </div>
      <div class="abs center s" id="s6s" style="top:340px;font-size:96px;color:#F4F2EE">por dentro</div>
      <div class="abs center h" id="s6h" style="top:470px;font-size:130px;color:#C6FF3D">CONECTADO</div>
    </div>

    <!-- T7 · Forma vectorial que barre y cambia la frase (ref #3) -->
    <div class="sc dark" id="s7">
      <div class="grid-d"></div>
      <div class="abs center h" id="s7a" style="top:820px;font-size:170px;color:#F4F2EE">7 MINUTOS</div>
      <div class="abs center h" id="s7b" style="top:820px;font-size:170px;color:#0B0B0F;opacity:0;z-index:3">NO 7 HORAS</div>
      <svg class="abs" id="s7tri" width="2600" height="2600" viewBox="0 0 100 100" style="left:-760px;top:-340px;z-index:2">
        <polygon points="50,0 100,100 0,100" fill="#C6FF3D"/>
      </svg>
    </div>

    <!-- T9 · Revelado por máscara + aberración lima/azul + subrayado a mano (ref #4 Hormozi) -->
    <div class="sc dark" id="s8">
      <div class="grid-d"></div>
      <div class="abs center s" id="s8s" style="top:640px;font-size:100px;color:#8C8C99">el gancho es</div>
      <div class="abs center" id="s8m" style="top:790px;height:260px;clip-path:inset(100% 0 0 0)">
        <div class="h abs center" id="s8b" style="font-size:250px;color:#2F5BFF;top:0">TODO</div>
        <div class="h abs center" id="s8l" style="font-size:250px;color:#C6FF3D;top:0;mix-blend-mode:screen">TODO</div>
        <div class="h abs center" id="s8w" style="font-size:250px;color:#F4F2EE;top:0">TODO</div>
      </div>
      <svg class="abs" width="1080" height="120" viewBox="0 0 300 50" style="left:0;top:1030px">
        <path id="s8u" d="M40 30 C 110 14, 190 40, 262 20" fill="none" stroke="#C6FF3D" stroke-width="7" stroke-linecap="round" stroke-dasharray="240" stroke-dashoffset="240"/>
      </svg>
    </div>

    <!-- T2 · Oclusión: billetes en primer plano tapan el cambio de escena (ref #1, #5). Va encima de todo. -->
    <div class="abs" id="occ" style="inset:0;z-index:40;pointer-events:none">
      <img class="abs" id="b0" src="assets/foto/billete_1957_duo.png" style="width:700px;left:1100px;top:300px;filter:blur(3px) drop-shadow(0 30px 40px rgba(0,0,0,.5))">
      <img class="abs" id="b1" src="assets/foto/billete_1957_duo.png" style="width:5000px;left:1200px;top:-90px;filter:blur(7px) drop-shadow(0 40px 60px rgba(0,0,0,.6))">
      <img class="abs" id="b2" src="assets/foto/billete_1957_duo.png" style="width:900px;left:-1000px;top:1280px;filter:blur(2px) drop-shadow(0 30px 40px rgba(0,0,0,.5))">
    </div>

    <img class="grain" src="assets/tex/grano.png">

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      // Escenas: [id, entra, sale]. Corte duro entre composiciones (ref #7): una idea = una composición.
      const ESCENAS = [["#s1", 0, 2.6], ["#s2", 2.6, 5.2], ["#s3", 5.2, 8.0], ["#s4", 8.0, 11.5],
                       ["#s5", 11.5, 14.5], ["#s6", 14.5, 17.5], ["#s7", 17.5, 19.6], ["#s8", 19.6, 22]];
      // Rueda de números del contador (solo transform: determinista al buscar fotogramas)
      const strip = document.getElementById("s3strip");
      for (let n = 90; n <= 100; n++) {
        const d = document.createElement("div");
        d.className = "h"; d.textContent = n;
        d.style.cssText = "height:330px;font-size:330px;line-height:330px;color:#C6FF3D;text-align:right;width:640px";
        strip.appendChild(d);
      }
      const tl = gsap.timeline({ paused: true });
      gsap.set("#s1", { visibility: "visible" });
      ESCENAS.forEach(([id, a, b], i) => {
        if (i > 0) tl.set(id, { visibility: "visible" }, a);
        tl.set(id, { visibility: "hidden" }, b);
      });

      // T1 · arco + titular por fragmentos
      gsap.set("#s1phone", { y: 500, rotation: -14, opacity: 0 });
      gsap.set(["#s1a", "#s1b"], { y: 120, opacity: 0 });
      gsap.set("#s1e", { opacity: 0, y: 30 });
      tl.to("#s1phone", { y: 0, rotation: -8, opacity: 1, duration: 0.7, ease: "back.out(1.4)" }, 0.05);
      tl.to("#s1c", { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 0.35);
      tl.to("#s1d", { opacity: 1, rotation: 40, transformOrigin: "50% 50%", duration: 2, ease: "none" }, 0.6);
      tl.to("#s1a", { y: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, 0.3);
      tl.to("#s1b", { y: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, 0.48);
      tl.to("#s1e", { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.8);
      tl.to("#s1phone", { y: -24, rotation: -5, duration: 1.4, ease: "sine.inOut" }, 0.8);

      // T2 · oclusión: el billete grande cubre todo el cuadro entre 2.5 y 2.7; el cambio de escena (2.6) queda oculto
      tl.to("#b0", { x: -1900, rotation: -25, duration: 0.9, ease: "power1.inOut" }, 1.95);
      tl.fromTo("#b1", { x: 0, y: 0, rotation: 6 }, { x: -6320, y: 0, rotation: -6, duration: 0.84, ease: "power1.inOut" }, 2.18);
      tl.to("#b2", { x: 2200, rotation: 30, duration: 1.0, ease: "power1.inOut" }, 2.2);

      // T3 · palabra que crece hasta el borde y corte duro
      gsap.set("#s2a", { opacity: 0, y: 40 });
      gsap.set("#s2b", { scale: 0.6, opacity: 0 });
      tl.to("#s2a", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.75);
      tl.to("#s2b", { scale: 1, opacity: 1, duration: 0.45, ease: "expo.out" }, 3.05);
      tl.to("#s2b", { scale: 1.12, duration: 1.15, ease: "none" }, 3.5);
      tl.to("#s2a", { opacity: 0, duration: 0.2 }, 4.45);
      tl.to("#s2b", { scale: 4.2, duration: 0.55, ease: "expo.in" }, 4.65);

      // T4 · contador rueda + línea
      gsap.set("#s3strip", { y: 0 });
      gsap.set(["#s3u", "#s3s"], { opacity: 0, x: 40 });
      tl.to("#s3strip", { y: -3300, duration: 0.9, ease: "expo.out" }, 5.4);
      tl.fromTo("#s3win", { scale: 1 }, { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 6.15);
      tl.to("#s3u", { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 6.1);
      tl.to("#s3line", { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 6.35);
      tl.to("#s3s", { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 6.7);

      // T5 · marco fijo: el contenido cambia con destello en cada golpe; la etiqueta llega después de la imagen
      gsap.set("#s4card", { scale: 0.85, opacity: 0, rotationY: -25, transformPerspective: 1600 });
      gsap.set("#s4tag", { scale: 0, rotation: -12 });
      tl.to("#s4card", { scale: 1, opacity: 1, rotationY: 0, duration: 0.55, ease: "expo.out" }, 8.0);
      tl.to("#s4tag", { scale: 1, rotation: -2, duration: 0.4, ease: "back.out(2)" }, 8.35);
      [[9.1, 1], [10.2, 2]].forEach(([t, k]) => {
        tl.fromTo("#s4fl", { opacity: 0.9 }, { opacity: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, t);
        tl.set("#s4p" + k, { opacity: 1 }, t);
        tl.set("#s4t" + (k - 1), { opacity: 0 }, t + 0.12);
        tl.set("#s4t" + k, { opacity: 1 }, t + 0.12);
        tl.fromTo("#s4tag", { scale: 0.8 }, { scale: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, t + 0.12);
      });
      tl.to("#s4card", { scale: 1.04, duration: 3, ease: "none" }, 8.55);

      // T6 · tarjeta: pequeña y desenfocada → nítida → renglones → expansión que ocluye con el texto delante
      gsap.set("#s5card", { scale: 0.32, y: 260, filter: "blur(16px)", opacity: 0.6 });
      gsap.set(["#s5r0", "#s5r1", "#s5r2", "#s5r3"], { scaleX: 0, transformOrigin: "0% 50%" });
      gsap.set("#s5t", { opacity: 0, y: 50 });
      tl.to("#s5card", { scale: 1, y: 0, filter: "blur(0px)", opacity: 1, duration: 0.7, ease: "expo.out" }, 11.55);
      ["#s5r0", "#s5r1", "#s5r2", "#s5r3"].forEach((r, i) => tl.to(r, { scaleX: 1, duration: 0.35, ease: "expo.out" }, 12.2 + i * 0.16));
      tl.to("#s5t", { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 13.0);
      tl.to("#s5card", { scale: 3.4, duration: 0.6, ease: "expo.in" }, 13.75);
      tl.to("#s5t", { color: "#0B0B0F", duration: 0.2 }, 14.1);

      // T8 · vista explotada
      // Inclinación (X) en un contenedor y giro (Z) en otro: si van juntos, el eje se mueve y la pila se corre de lado
      gsap.set("#s6tilt", { rotationX: 55, transformOrigin: "50% 50%", scale: 0.6, opacity: 0 });
      gsap.set("#s6stack", { rotationZ: -40, transformOrigin: "50% 50%" });
      gsap.set(["#s6s", "#s6h"], { opacity: 0, y: 40 });
      tl.to("#s6tilt", { scale: 1, opacity: 1, duration: 0.6, ease: "expo.out" }, 14.55);
      tl.to("#s6s", { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 14.7);
      tl.to("#s6h", { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 14.85);
      [0, 1, 2, 3, 4].forEach((k) => {
        tl.to("#s6l" + k, { z: k * 85, duration: 0.8, ease: "expo.out" }, 15.2 + k * 0.05);
        tl.to("#s6l" + k, { z: 0, duration: 0.4, ease: "power3.in" }, 16.75);
      });
      tl.to("#s6stack", { rotationZ: -20, duration: 2.3, ease: "sine.inOut" }, 14.9);
      tl.fromTo("#s6tilt", { scale: 1 }, { scale: 1.1, duration: 0.15, yoyo: true, repeat: 1, immediateRender: false }, 17.15);

      // T7 · triángulo lima que barre: tapa "7 MINUTOS" y deja "NO 7 HORAS" en carbón sobre lima
      gsap.set("#s7a", { opacity: 0, scale: 0.8 });
      gsap.set("#s7tri", { y: 2700, rotation: -20, transformOrigin: "50% 50%" });
      tl.to("#s7a", { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, 17.55);
      tl.to("#s7tri", { y: 0, rotation: 0, duration: 0.5, ease: "expo.out" }, 18.3);
      tl.set("#s7b", { opacity: 1 }, 18.5);
      tl.fromTo("#s7b", { scale: 1.3 }, { scale: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, 18.5);

      // T9 · máscara + aberración + subrayado
      gsap.set("#s8s", { opacity: 0, y: 30 });
      tl.to("#s8s", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 19.7);
      tl.to("#s8m", { clipPath: "inset(0% 0 0 0)", duration: 0.5, ease: "expo.out" }, 20.0);
      tl.fromTo("#s8w", { y: 120 }, { y: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, 20.0);
      [[0, -14, 14], [0.06, 9, -9], [0.12, -5, 5], [0.18, 0, 0]].forEach(([dt, xb, xl]) => {
        tl.set("#s8b", { x: xb }, 20.05 + dt);
        tl.set("#s8l", { x: xl }, 20.05 + dt);
      });
      tl.to("#s8u", { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 20.55);
      [[21.2, 6, -6], [21.26, -3, 3], [21.32, 0, 0]].forEach(([t, xb, xl]) => {
        tl.set("#s8b", { x: xb }, t);
        tl.set("#s8l", { x: xl }, t);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["tecnicas"] = tl;
    </script>
  </div>
</template>
