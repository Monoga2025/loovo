  RW.map((r) => { const y1 = 1050 + r * 104 + 44, y2 = 1050 + ((r * 4 + 1) % 6) * 104 + 44, dx = 108, dy = y2 - y1;
    return `<i class="hair" id="ln${r}" style="left:486px;top:${y1}px;width:${Math.hypot(dx, dy)}px;transform:rotate(${Math.atan2(dy, dx) * 180 / Math.PI}deg)"></i>`; }).join("") +
  '<div id="mark" style="top:1050px"></div>';
pop("#chL", XT, { x: -200 }); pop("#chR", LB, { x: 200 });
gsap.set(RW.flatMap((r) => ["#cL" + r, "#cR" + r]), { autoAlpha: 0 });
RW.forEach((r) => { tl.fromTo("#cL" + r, { autoAlpha: 0, x: -60 }, { autoAlpha: 1, x: 0, duration: 4 * F, ease: "power3.out", immediateRender: false }, XT + 0.15 + r * 0.07);
  tl.fromTo("#cR" + r, { autoAlpha: 0, x: 60 }, { autoAlpha: 1, x: 0, duration: 4 * F, ease: "power3.out", immediateRender: false }, LB + 0.1 + r * 0.07); });
RW.forEach((r) => { gsap.set("#ln" + r, { scaleX: 0 }); tl.to("#ln" + r, { scaleX: 1, duration: 0.18, ease: "power2.out" }, SG - 0.2 + r * 0.09); });
tl.to("#w3", { rotationX: -12, rotationY: 8, z: 60, duration: 0.9, ease: "expo.out" }, XT - 0.1);
fadeOut("#tx3b", at("en", 43.5) - 4 * F);
words("#tx3c", [[["en", at("en", 43.5)], ["segundos", SG, "s"]], [["y te marca en", at("y", 44.2)], ["rojo", RJ]], [["hasta el", at("hasta", 45.3)]]]);
kbox("#tx3c", "", "4x1000", MX, false, 520);
// fila marcada (en dorado: la marca no usa rojo)
const MR = 3;
gsap.set("#mark", { autoAlpha: 0, y: MR * 104 - 12 });
tl.fromTo("#mark", { autoAlpha: 0, scale: 1.25 }, { autoAlpha: 1, scale: 1, duration: 5 * F, ease: "power3.out", immediateRender: false }, MK - LEAD);
[0, 1, 2, 3].forEach((k) => tl.to("#mark", { x: k % 2 ? 8 : -8, duration: 2 * F, ease: "none" }, RJ + k * 2 * F));
tl.to("#mark", { x: 0, duration: 2 * F }, RJ + 8 * F);
tl.to(["#cL" + MR], { backgroundColor: "#F1E6CC", duration: 0.2 }, MK);
tl.to("#w3", { rotationX: 4, rotationY: -6, z: 120, duration: MG3E - MK, ease: "sine.inOut" }, MK);
destello(MG3E, ["#mg3"]);
show("#shade", MG3E);

// =============== 9. CTA: comenten D1 / D2 / D3 (persona) ===============
card("Si lo quieren *usar,*", at("si", 46.8), at("quiero", 47.9));
card("quiero que *comenten*", at("quiero", 47.9), at("d1", 48.6));
const D1 = at("d1", 48.6), D2 = at("d2", 51.8), D3 = at("d3", 55.4);
$("#cta").innerHTML = '<span class="r" id="cr1"><span class="d">D1</span>primer sistema</span><span class="r" id="cr2"><span class="d">D2</span>segundo sistema</span><span class="r" id="cr3"><span class="d">D3</span>los tres</span>';
gsap.set(["#cr1", "#cr2", "#cr3"], { autoAlpha: 0 });
[["#cr1", D1], ["#cr2", D2], ["#cr3", D3]].forEach(([s, t]) => {
  tl.fromTo(s, { autoAlpha: 0, x: -60, filter: "blur(10px)" }, { autoAlpha: 1, x: 0, filter: "blur(0px)", duration: 5 * F, ease: "power3.out", immediateRender: false }, t - LEAD);
  tl.fromTo(s + " .d", { scale: 1.5 }, { scale: 1, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, t - LEAD);
});
const LA = at("los", 57.8);
tl.to("#cta", { autoAlpha: 0, filter: "blur(12px)", duration: 4 * F, ease: "power1.in" }, LA - 4 * F);

// =============== 10. Cierre ===============
card("Los amo, *muchachos,*", LA, at("adiós", 59));
card("adiós.", at("adiós", 59), PL + 0.1);
tl.to("#shade", { autoAlpha: 0, duration: 0.3, ease: "sine.inOut" }, PL);
tl.fromTo("#pl", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, ease: "sine.inOut", immediateRender: false }, PL);
gsap.set(["#plA", "#plB"], { autoAlpha: 0 }); gsap.set("#plH", { scaleX: 0 });
tl.fromTo("#plA", { autoAlpha: 0, y: 30, filter: "blur(14px)" }, { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 8 * F, ease: "power2.out", immediateRender: false }, PL + 0.2);
tl.fromTo("#plB", { autoAlpha: 0, scale: 0.6, filter: "blur(14px)" }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 9 * F, ease: "power2.out", immediateRender: false }, PL + 0.35);
tl.to("#plH", { scaleX: 1, duration: 0.45, ease: "sine.inOut" }, PL + 0.5);

// grano de papel cada 2 cuadros
for (let i = 0; i < Math.ceil(D.total / (2 * F)); i++) tl.set("#grain", { x: ((i * 73) % 180) - 90, y: ((i * 131) % 180) - 90 }, i * 2 * F);
tl.set({}, {}, D.total);
window.__timelines["main"] = tl;
</script>
