html, body { width: 1080px; height: 1920px; overflow: hidden; background: #F6F4EF; font-family: "Montserrat", sans-serif; font-weight: 600; }

.carbon { background: #2A2926; }
.dots { position: absolute; left: -120px; top: -120px; width: 1320px; height: 2160px;

.title { position: absolute; left: 0; width: 1080px; text-align: center; color: #2A2926; font-size: 100px; line-height: 1.12; white-space: nowrap; }
.carbon .title { color: #FBF8F1; }
.serif { font-family: "Playfair Display", serif; font-style: italic; font-weight: 700; }
.lbl { position: absolute; font-family: "Playfair Display", serif; font-style: italic; font-weight: 700; font-size: 80px; color: #A88F57; white-space: nowrap; }
.carbon .lbl { color: #E6D6AE; }
/* caja de palabra clave: carbón + cursor dorado (crema sobre carbón) */
.kbox { position: absolute; height: 168px; white-space: nowrap; }
.kbox .bg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #2A2926; box-shadow: 0 34px 70px -24px rgba(90,74,44,.34); }
.kbox .tx { position: relative; padding: 0 44px; line-height: 168px; font-family: "Playfair Display", serif; font-style: italic; font-weight: 700; font-size: 132px; color: #E6D6AE; }
.kbox .cov { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #2A2926; }
.kbox .cw { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.kbox .cur { position: absolute; top: 18px; left: -12px; width: 12px; height: 132px; background: #C8B07A; }
.kbox.light .bg, .kbox.light .cov { background: #FBF8F1; }
.kbox.light .tx { color: #2A2926; }
.kbox .strike { position: absolute; left: 30px; top: 86px; height: 10px; width: calc(100% - 60px); background: #C8B07A; }
.tile { position: absolute; background: #2A2926; box-shadow: 0 34px 70px -24px rgba(90,74,44,.40); }
.tile.light { background: #FBF8F1; box-shadow: 0 30px 60px -24px rgba(90,74,44,.30); }
.ico { position: absolute; left: 22%; top: 22%; width: 56%; height: 56%; background: #E6D6AE;
  -webkit-mask: var(--i) center/contain no-repeat; mask: var(--i) center/contain no-repeat; }
.tile.light .ico { background: #2A2926; }
.goldico { background: #C8B07A; }
.frame { position: absolute; background: #141312; box-shadow: 0 40px 80px -30px rgba(20,16,10,.55); }
.frame .bar { position: absolute; left: 0; top: 0; width: 100%; height: 34px; background: #3A3834; }
.frame .bar i { position: absolute; top: 12px; width: 10px; height: 10px; background: #8C887F; }
.frame video { position: absolute; }
svg { position: absolute; left: 0; top: 0; overflow: visible; }
.dot { position: absolute; width: 34px; height: 34px; background: #C8B07A; border-radius: 50% !important; box-shadow: 0 0 24px rgba(200,176,122,.8); }
.chip { position: absolute; width: 70px; height: 70px; border: 5px solid #E6D6AE; background: rgba(230,214,174,.10); }
#caps { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 50; pointer-events: none; }
.cap { position: absolute; left: 70px; width: 890px; top: 1300px; text-align: center; font-size: 78px; line-height: 1.12; color: #2A2926; visibility: hidden;
  text-shadow: 0 2px 10px rgba(246,244,239,.9); }
.cap.dk { color: #FBF8F1; text-shadow: 0 2px 6px rgba(20,16,10,.5), 0 6px 26px rgba(20,16,10,.38); }
.cap b { font-weight: 600; color: #A88F57; }
.cap.dk b { color: #E6D6AE; }
#grain { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 60; background: url("assets/grano.png"); mix-blend-mode: multiply; opacity: .05; pointer-events: none; }
#flash { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 70; background: #FFFBF2; opacity: 0; pointer-events: none; }
</style>

tl.fromTo("#c11", { scale: 1.12 }, { scale: 1.0, duration: 1.75, ease: "power2.out", immediateRender: false }, 36.95);

// ---------- S12 flujo más rápido (destello crema) ----------
flash(38.72);
gsap.set("#m1, #m2, #m3, #m4, #bolt", { autoAlpha: 0 });
["#m1", "#m2", "#m3", "#m4"].forEach((m, i) => pop(m, 38.80 + i * 0.07));
tl.to("#orb", { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 39.0);
gsap.set("#orbit", { rotation: 0, autoAlpha: 0 });
tl.set("#orbit", { autoAlpha: 1 }, 39.5);
tl.to("#orbit", { rotation: 1440, duration: DUR - 39.5, ease: "power2.in" }, 39.5);
pop("#bolt", 40.32, 0.3);
kbox("#krap", 40.49);
tl.fromTo("#c12", { scale: 1.1, rotationX: 14 }, { scale: 1.0, rotationX: 0, duration: DUR - 38.72, ease: "power2.out", immediateRender: false }, 38.72);

// ---------- subtítulos: tarjetas de 2-4 palabras, enteras al onset - 2 cuadros ----------
const DARK = [[5.95, 8.62], [11.45, 17.2], [36.95, 38.72]];
const HIDE = [[0, 1.25], [8.62, 9.6], [17.2, 20.15]];   // donde el título ya dice lo mismo
const KEYS = new Set(["n8n", "loop", "Claude", "Code", "claude", "code", "agentes", "subagentes", "problemas", "orquestador", "principal", "contexto", "solucionar", "texto", "archivos", "tokens", "rápido", "termina", "inicia"]);
const clean = (w) => w.replace(/[¿?,.]/g, "");
const groups = []; let g = [];
WORDS.forEach((w, i) => { g.push(w); const n = WORDS[i + 1]; const end = /[,?.]$/.test(w[0]) || g.length >= 3 || (n && n[1] - w[2] > 0.35) || (n && (g.map((x) => x[0]).join(" ") + " " + n[0]).length > 18); if (end || !n) { groups.push(g); g = []; } });
const caps = $("#caps");
groups.forEach((gr, i) => {
  const t0 = gr[0][1] - 2 * F; const nx = groups[i + 1]; let t1 = Math.min(nx ? nx[0][1] - 2 * F : DUR, gr[gr.length - 1][2] + 0.6);
  SC.forEach(([id, a]) => { if (a > t0 + 0.05 && a < t1) t1 = a; });
  if (HIDE.some(([a, b]) => t0 >= a - 0.05 && t0 < b)) return;
  const d = document.createElement("div"); d.className = "cap" + (DARK.some(([a, b]) => t0 >= a && t0 < b) ? " dk" : "");
  d.innerHTML = gr.map((w) => KEYS.has(clean(w[0])) ? "<b>" + w[0] + "</b>" : w[0]).join(" ");
  caps.appendChild(d);
  tl.fromTo(d, { visibility: "visible", autoAlpha: 0, filter: "blur(8px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 2 * F, ease: "none", immediateRender: false }, t0);
  tl.set(d, { autoAlpha: 0, visibility: "hidden" }, t1);
});
tl.set({}, {}, DUR);
</script>
