<!DOCTYPE html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Canal 2026-10-21 contadores</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=block" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: #070707; font-family: "Inter", sans-serif;
      }
      #base {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; z-index: 0;
        transform-origin: 50% 42%;
      }
      #person {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; z-index: 2; transform-origin: 50% 42%;
      }
      #pip {
        position: absolute; left: 75px; top: 1170px; width: 240px; height: 240px;
        border-radius: 50%; object-fit: cover; object-position: 50% 32%;
        border: 7px solid #ffffff; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        z-index: 5; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-xqq5" id="root" data-composition-id="main" data-start="0" data-duration="39.64" data-width="1080" data-height="1920">
      <!-- Footage sin audio: la mezcla final (voz + música + SFX) se hace con ffmpeg -->
      <video data-hf-id="hf-bff8" id="base" class="clip" src="assets/clean.mp4" data-start="0" data-duration="39.64" data-track-index="0" muted playsinline></video>
      <!-- Palabras gigantes DETRÁS del hablante -->
      <div id="behind" data-composition-id="behind" data-composition-src="compositions/behind.html"
           data-start="0" data-duration="39.64" data-track-index="1" data-width="1080" data-height="1920"
           style="position: absolute; inset: 0; z-index: 1"></div>
      <!-- Silueta recortada (alfa) encima de las palabras; mismo zoom que #base -->
      <video id="person" class="clip" src="assets/person.webm" data-start="0" data-duration="39.64"
             data-track-index="2" muted playsinline></video>
      <div data-hf-id="hf-ipsd" id="graphics" data-composition-id="graphics" data-composition-src="compositions/graphics.html" data-start="0" data-duration="39.64" data-track-index="1" data-width="1080" data-height="1920" style="position: absolute; inset: 0; z-index: 4"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      // Mismo remapeo de tiempos que compositions/graphics.html (plan/timemap.json)
      const MAP_OLD = [0, 39.637];
      const MAP_NEW = [0, 39.637];
      const T = (t) => {
        let i = 1;
        while (i < MAP_OLD.length - 1 && t > MAP_OLD[i]) i++;
        const [a, b, c, d] = [MAP_OLD[i - 1], MAP_OLD[i], MAP_NEW[i - 1], MAP_NEW[i]];
        return c + ((t - a) * (d - c)) / (b - a);
      };
      const root = gsap.timeline({ paused: true });
      const tl = {
        to: (s, v, p) => root.to(s, v, T(p)),
        fromTo: (s, a, b, p) => root.fromTo(s, a, b, T(p)),
        set: (s, v, p) => root.set(s, v, T(p)),
      };
      const V = "#base, #person";

      // Zoom de tendencia: push lento continuo, punch-in con easing expo en
      // palabras clave y zoom látigo con desenfoque en las transiciones.
      const land = (t, from) =>
        tl.fromTo(V, { scale: from, filter: "blur(10px)" },
          { scale: 1.0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, t);
      const push = (t0, t1, to) =>
        tl.to(V, { scale: to, duration: t1 - t0, ease: "none" }, t0);
      const punch = (t, to) =>
        tl.to(V, { scale: to, duration: 0.38, ease: "expo.out" }, t);
      const whip = (t) =>
        tl.to(V, { scale: "+=0.55", filter: "blur(16px)", duration: 0.22, ease: "power3.in" }, t);
      const shake = (t, amp) => {
        const xs = [amp, -amp * 0.8, amp * 0.6, -amp * 0.4, amp * 0.2, 0];
        xs.forEach((x, i) => tl.to(V, { x, duration: 0.04, ease: "none" }, t + i * 0.04));
      };

      gsap.set(V, { scale: 1.0, x: 0, filter: "blur(0px)" });
      // t1
      push(0, 1.95, 1.06);
      punch(1.97, 1.15);
      push(2.4, 3.67, 1.19);
      // t2
      tl.set(V, { scale: 1.0 }, 3.69);
      push(3.69, 4.75, 1.04);
      punch(4.77, 1.28);
      // t3
      tl.set(V, { scale: 1.0 }, 5.2);
      push(5.2, 7.93, 1.08);
      punch(7.95, 1.15);
      whip(8.63);
      // t4
      land(8.85, 1.3);
      push(9.3, 10.33, 1.05);
      punch(10.35, 1.15);
      push(10.8, 12.21, 1.18);
      punch(12.23, 1.28);
      shake(12.23, 16);
      // t5
      tl.set(V, { scale: 1.0, x: 0 }, 12.98);
      push(12.98, 14.71, 1.06);
      punch(14.73, 1.15);
      push(15.15, 17.17, 1.18);
      punch(17.19, 1.28);
      // t6
      tl.set(V, { scale: 1.0 }, 17.82);
      push(17.82, 20.42, 1.05);
      punch(20.44, 1.15);
      // t7
      land(20.71, 1.28);
      push(21.16, 24.08, 1.08);
      punch(24.1, 1.28);
      // t8
      tl.set(V, { scale: 1.0, filter: "blur(0px)" }, 26.65);
      push(26.65, 29.77, 1.08);
      // t9
      tl.set(V, { scale: 1.0 }, 29.78);
      push(29.78, 30.59, 1.03);
      punch(30.61, 1.15);
      push(31.0, 34.73, 1.18);
      // t10
      tl.set(V, { scale: 1.0 }, 34.74);
      push(34.74, 39.18, 1.1);
      punch(39.2, 1.28);
      shake(39.2, 12);

      window.__timelines["main"] = root;
    </script>
  </body>
</html>
