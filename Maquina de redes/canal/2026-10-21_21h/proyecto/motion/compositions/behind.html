<template id="behind-template">
  <!--
    Palabras gigantes DETRÁS del hablante: esta capa va entre el video de fondo
    (#base) y la silueta recortada (#person) en index.html. Arriba, sobre la
    pared, donde la cabeza tapa solo una parte de las letras.
  -->
  <div data-composition-id="behind" data-width="1080" data-height="1920" data-duration="39.64">
    <div id="bw"></div>
    <style>
      [data-composition-id="behind"] { background: transparent; font-family: "Inter", sans-serif; overflow: hidden; }
      .bword {
        position: absolute; left: 0; width: 100%; text-align: center; visibility: hidden;
        font-weight: 900; letter-spacing: -0.055em; line-height: 0.86; color: #151515;
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.12);
      }
      .bword.red { color: #e3120b; text-shadow: 0 8px 40px rgba(227, 18, 11, 0.25); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      // [texto, aparece (s), desaparece (s), tamaño px, top px, rojo?]
      // Tiempos en la línea del corte anterior; T() los lleva al corte actual.
      const WORDS = [
        ["9 PM", 1.97, 3.52, 320, 260, 0],
        ["RESPUESTA", 4.77, 6.32, 185, 305, 1],
        ["PIJAMA", 7.95, 9.5, 270, 280, 0],
        ["IA", 10.35, 11.9, 320, 260, 1],
        ["PRIMERO", 12.23, 13.78, 230, 290, 0],
        ["RETENCIÓN", 14.73, 16.28, 180, 305, 1],
        ["VENCE", 17.19, 18.74, 300, 270, 0],
        ["ESTATUTO", 24.1, 25.65, 200, 300, 1],
        ["CRITERIO", 30.61, 32.16, 200, 300, 0],
        ["COMENTARIOS", 39.2, 39.64, 150, 315, 1],
      ];
      const host = document.getElementById("bw");
      WORDS.forEach(([txt, , , size, top, red], i) => {
        const d = document.createElement("div");
        d.className = "bword" + (red ? " red" : "");
        d.id = "bw" + i;
        d.innerHTML = txt;
        d.style.fontSize = size + "px";
        d.style.top = top + "px";
        host.appendChild(d);
      });

      const MAP_OLD = [0, 39.637];
      const MAP_NEW = [0, 39.637];
      const T = (t) => {
        let i = 1;
        while (i < MAP_OLD.length - 1 && t > MAP_OLD[i]) i++;
        const [a, b, c, d] = [MAP_OLD[i - 1], MAP_OLD[i], MAP_NEW[i - 1], MAP_NEW[i]];
        return c + ((t - a) * (d - c)) / (b - a);
      };
      const tl = gsap.timeline({ paused: true });
      WORDS.forEach(([, a, b], i) => {
        const el = "#bw" + i;
        tl.set(el, { visibility: "visible" }, T(a));
        tl.fromTo(el, { opacity: 0, y: 140, scale: 0.9, filter: "blur(18px)" },
          { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out" }, T(a));
        // deriva lenta mientras está en pantalla (parallax contra el zoom del video)
        tl.to(el, { y: -26, duration: Math.max(T(b) - T(a) - 0.6, 0.1), ease: "none" }, T(a) + 0.42);
        tl.to(el, { opacity: 0, y: -90, filter: "blur(14px)", duration: 0.18, ease: "power2.in" }, T(b) - 0.18);
        tl.set(el, { visibility: "hidden" }, T(b));
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["behind"] = tl;
    </script>
  </div>
</template>
