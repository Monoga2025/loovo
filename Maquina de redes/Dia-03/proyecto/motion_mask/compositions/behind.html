<template id="behind-template">
  <!-- Palabras gigantes DETRÁS del hablante (entre el fondo y la silueta). Solo palabras que dice, una línea,
       sobre la pared; la cabeza tapa la parte de abajo. Verificar en snapshots en cada tramo de zoom. -->
  <div data-composition-id="behind" data-width="1080" data-height="1920" data-duration="56.600000">
    <div id="bw"></div>
    <style>
      @font-face { font-family: "SG"; font-weight: 700; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); }
      [data-composition-id="behind"] { background: transparent; overflow: hidden; }
      .bword { position: absolute; left: 0; width: 100%; text-align: center; visibility: hidden; white-space: nowrap;
        font-family: "SG", sans-serif; font-weight: 700; letter-spacing: -0.065em; line-height: .8; }
      .c-li { color: #C6FF3D; text-shadow: 0 10px 50px rgba(198,255,61,.25); }
      .c-hu { color: #F4F2EE; text-shadow: 0 10px 40px rgba(0,0,0,.25); }
      .c-bl { color: #2F5BFF; text-shadow: 0 10px 50px rgba(47,91,255,.35); }
      .c-ol { color: transparent; -webkit-text-stroke: 4px #F4F2EE; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      // [texto, aparece, desaparece, tamaño, top, color]
      const WORDS = [
        ["3", 0.99, 2.33, 470, 180, "c-li"],
        ["CANSADÍSIMO", 3.81, 5.1, 150, 300, "c-hu"],
        ["CUELLO", 6.0, 6.88, 250, 280, "c-ol"],
        ["CRM", 12.73, 14.55, 380, 230, "c-li"],
        ["IA", 14.61, 16.18, 420, 220, "c-bl"],
        ["UNIVERSIDAD", 20.2, 21.28, 150, 300, "c-hu"],
        ["SKILL", 25.9, 27.38, 280, 170, "c-li"],
        ["ARNÉS", 38.83, 40.38, 300, 260, "c-li"],
        ["SERVICIOS", 45.65, 46.72, 185, 300, "c-hu"],
        ["PROYECTOS", 48.03, 48.88, 185, 300, "c-ol"],
      ];
      const host = document.getElementById("bw");
      WORDS.forEach(([txt, , , size, top, cls], i) => {
        const d = document.createElement("div");
        d.className = "bword " + cls; d.id = "bw" + i; d.textContent = txt;
        d.style.fontSize = size + "px"; d.style.top = top + "px";
        host.appendChild(d);
      });
      const tl = gsap.timeline({ paused: true });
      WORDS.forEach(([, a, b], i) => {
        const el = "#bw" + i;
        tl.set(el, { visibility: "visible" }, a);
        tl.fromTo(el, { opacity: 0, y: 160, scale: 0.85, filter: "blur(18px)" },
          { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out", immediateRender: false }, a);
        tl.to(el, { y: -26, duration: Math.max(b - a - 0.6, 0.1), ease: "none" }, a + 0.42);
        tl.to(el, { opacity: 0, y: -90, filter: "blur(14px)", duration: 0.18, ease: "power2.in" }, b - 0.18);
        tl.set(el, { visibility: "hidden" }, b);
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["behind"] = tl;
    </script>
  </div>
</template>
