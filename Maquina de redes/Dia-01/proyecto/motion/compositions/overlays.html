<template id="overlays-template">
  <!--
    Motion DELANTE del hablante mientras habla (tramos de cabeza hablando):
    stickers, chips y trazos a los lados de la cara, fuera de la franja de
    subtítulos (y 1170-1300) y dentro de la zona segura.
  -->
  <div data-composition-id="overlays" data-width="1080" data-height="1920" data-duration="38.06">
    <!-- ni idea -->
    <div class="q" id="q1" style="left: 120px; top: 560px">?</div>
    <div class="q" id="q2" style="left: 850px; top: 470px">?</div>
    <div class="q" id="q3" style="left: 880px; top: 780px; font-size: 120px">?</div>
    <!-- ya existe -->
    <div class="chip" id="c-existe" style="left: 640px; top: 860px"><span class="e">✅</span>ya existe</div>
    <!-- no se hace -->
    <div class="sticker" id="s-no" style="left: 790px; top: 640px"><span class="e">🚫</span></div>
    <div class="ring" id="r-no" style="left: 790px; top: 640px"></div>
    <!-- meta -->
    <div class="sticker" id="s-meta" style="left: 95px; top: 660px"><span class="e">🎯</span></div>
    <div class="ring" id="r-meta" style="left: 95px; top: 660px"></div>
    <!-- hoy -->
    <div class="chip" id="c-hoy" style="left: 690px; top: 820px"><span class="e">📅</span>hoy</div>
    <!-- diferente: barras de glitch -->
    <div class="gbar" id="g1" style="top: 235px; background: #e3120b"></div>
    <div class="gbar" id="g2" style="top: 1040px; background: #00e5ff"></div>
    <div class="gbar" id="g3" style="top: 1110px; background: #e3120b"></div>
    <!-- mejores -->
    <div class="sticker" id="s-top" style="left: 800px; top: 650px"><span class="e">🏆</span></div>
    <div class="spark" id="sp1" style="left: 770px; top: 600px">✦</div>
    <div class="spark" id="sp2" style="left: 965px; top: 640px">✦</div>
    <div class="spark" id="sp3" style="left: 935px; top: 840px">✦</div>
    <!-- evento -->
    <div class="chip" id="c-evento" style="left: 80px; top: 880px"><span class="e">🎟️</span>evento</div>
    <!-- acompañen: Día 1 de 42 -->
    <div class="chip" id="c-dia" style="left: 80px; top: 820px"><span class="e">📍</span>Día 1 / 42</div>
    <!-- qué tan lejos: trayectoria que se dibuja -->
    <svg class="full" viewBox="0 0 1080 1920">
      <path id="p-lejos" d="M790,1090 C880,930 820,760 880,620 C920,520 930,420 945,345" pathLength="1"
            fill="none" stroke="#e3120b" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="0.02 0.018" stroke-dashoffset="0" opacity="0" />
      <circle id="p-dot" cx="945" cy="345" r="22" fill="#e3120b" opacity="0" />
    </svg>

    <style>
      [data-composition-id="overlays"] { background: transparent; font-family: "Inter", sans-serif; overflow: hidden; }
      @font-face { font-family: "Emoji"; src: local("Segoe UI Emoji"); }
      .full { position: absolute; inset: 0; width: 100%; height: 100%; }
      .e { font-family: "Emoji", sans-serif; }
      .q {
        position: absolute; font-size: 150px; font-weight: 900; color: #e3120b; visibility: hidden;
        text-shadow: 0 10px 30px rgba(227, 18, 11, 0.35), 0 0 2px #fff;
      }
      .chip {
        position: absolute; display: flex; align-items: center; gap: 14px; visibility: hidden;
        padding: 18px 30px; background: #ffffff; border-radius: 999px;
        font-size: 46px; font-weight: 800; color: #141414; letter-spacing: -0.02em; white-space: nowrap;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
      }
      .sticker {
        position: absolute; width: 190px; height: 190px; border-radius: 50%; visibility: hidden;
        background: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 110px;
        box-shadow: 0 20px 44px rgba(0, 0, 0, 0.25), 0 0 0 8px rgba(227, 18, 11, 0.9);
      }
      .ring {
        position: absolute; width: 190px; height: 190px; border-radius: 50%; visibility: hidden;
        border: 8px solid #e3120b;
      }
      .gbar { position: absolute; left: 0; width: 100%; height: 26px; mix-blend-mode: multiply; visibility: hidden; }
      .spark { position: absolute; font-size: 60px; color: #e3120b; visibility: hidden; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      const MAP_OLD = [0, 3.89, 7.2, 10.21, 14.78, 18.68, 20.61, 26.11, 32.53, 34.69, 38.14];
      const MAP_NEW = [0, 3.857, 7.178, 10.178, 14.749, 18.634, 20.557, 26.057, 32.48, 34.634, 38.057];
      const T = (t) => {
        let i = 1;
        while (i < MAP_OLD.length - 1 && t > MAP_OLD[i]) i++;
        const [a, b, c, d] = [MAP_OLD[i - 1], MAP_OLD[i], MAP_NEW[i - 1], MAP_NEW[i]];
        return c + ((t - a) * (d - c)) / (b - a);
      };
      const root = gsap.timeline({ paused: true });
      const tl = {
        to: (s, v, p) => root.to(s, v, T(p)),
        fromTo: (s, a, b, p) => root.fromTo(s, a, b, T(p)),
        set: (s, v, p) => root.set(s, v, T(p)),
      };
      // Entrada con spring + rotación, flotado suave, salida rápida
      const pop = (sel, a, b, rot = 0) => {
        tl.set(sel, { visibility: "visible" }, a);
        tl.fromTo(sel, { opacity: 0, scale: 0, rotation: rot - 25 },
          { opacity: 1, scale: 1, rotation: rot, duration: 0.45, ease: "back.out(2.4)" }, a);
        tl.to(sel, { y: -18, duration: Math.max(b - a - 0.65, 0.1), ease: "sine.inOut" }, a + 0.45);
        tl.to(sel, { opacity: 0, scale: 0.6, duration: 0.16, ease: "power2.in" }, b - 0.16);
        tl.set(sel, { visibility: "hidden" }, b);
      };
      const ring = (sel, t) => {
        tl.set(sel, { visibility: "visible" }, t);
        tl.fromTo(sel, { opacity: 1, scale: 0.6 }, { opacity: 0, scale: 1.9, duration: 0.55, ease: "power2.out" }, t);
        tl.set(sel, { visibility: "hidden" }, t + 0.56);
      };

      pop("#q1", 4.72, 5.85, -12); pop("#q2", 4.8, 5.85, 10); pop("#q3", 4.88, 5.85, 18);
      pop("#c-existe", 7.62, 8.02, -4);
      pop("#s-no", 11.85, 12.36, -12); ring("#r-no", 11.9);
      pop("#s-meta", 21.49, 22.9, 8); ring("#r-meta", 21.55);
      pop("#c-hoy", 22.97, 24.1, 5);
      // glitch: barras que parpadean en "totalmente diferente"
      ["#g1", "#g2", "#g3"].forEach((g, k) => {
        [0, 0.08, 0.16, 0.3, 0.44].forEach((dt, j) =>
          tl.set(g, { visibility: j % 2 ? "hidden" : "visible", x: (j % 2 ? -1 : 1) * (40 + 30 * k) }, 25.17 + dt + k * 0.02));
        tl.set(g, { visibility: "hidden" }, 25.8);
      });
      pop("#s-top", 27.34, 28.08, -8);
      ["#sp1", "#sp2", "#sp3"].forEach((s, k) => {
        tl.set(s, { visibility: "visible" }, 27.42 + k * 0.07);
        tl.fromTo(s, { scale: 0, rotation: 0, opacity: 1 },
          { scale: 1.2, rotation: 90, duration: 0.35, ease: "back.out(3)" }, 27.42 + k * 0.07);
        tl.to(s, { scale: 0, opacity: 0, duration: 0.2 }, 27.9);
        tl.set(s, { visibility: "hidden" }, 28.1);
      });
      pop("#c-evento", 28.12, 28.36, 3);
      pop("#c-dia", 34.95, 36.6, -3);
      // trayectoria "qué tan lejos": se dibuja con trazo discontinuo y termina en un punto
      gsap.set("#p-lejos", { strokeDasharray: "0 1" });
      tl.set("#p-lejos", { opacity: 1 }, 36.66);
      tl.fromTo("#p-lejos", { strokeDasharray: "0 1" }, { strokeDasharray: "1 0", duration: 0.6, ease: "power2.inOut" }, 36.66);
      tl.fromTo("#p-dot", { opacity: 0, scale: 0, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, 37.2);
      tl.to(["#p-lejos", "#p-dot"], { opacity: 0, duration: 0.15 }, 37.45);

      window.__timelines = window.__timelines || {};
      window.__timelines["overlays"] = root;
    </script>
  </div>
</template>
