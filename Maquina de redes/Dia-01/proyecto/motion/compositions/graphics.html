    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      // ---------- Datos: subtítulos (tiempos de build/words_out.json; * = palabra clave) ----------
      const CAPS = [
        { a: 1.86, b: 2.5, w: [["en", 2.0], ["un", 2.13], ["evento", 2.21]] },
        { a: 2.5, b: 3.03, w: [["con", 2.5], ["más", 2.74], ["de", 2.9]] },

        { a: 5.01, b: 5.62, w: [["cuánto", 5.01], ["puede", 5.33], ["llegar", 5.47]] },
        { a: 5.62, b: 6.31, w: [["a", 5.62], ["cambiar", 5.74], ["Loovo", 5.94, 1]] },
        { a: 6.31, b: 7.18, w: [["durante", 6.31], ["este", 6.53], ["tiempo", 6.83, 1]] },
        { a: 7.24, b: 8.12, w: [["Loovo", 7.24, 1], ["ya", 7.62], ["existe", 7.77]] },
        { a: 10.3, b: 10.97, w: [["Así", 10.3], ["que", 10.45], ["decidí", 10.63, 1]] },
        { a: 10.97, b: 11.53, w: [["hacer", 10.97], ["algo", 11.13], ["que", 11.39]] },
        { a: 11.53, b: 12.4, u: 12.0, w: [["normalmente", 11.53], ["no", 11.85, 1], ["se", 12.17, 1], ["hace", 12.29, 1]] },
        { a: 20.7, b: 21.6, w: [["Así", 20.7], ["que", 21.02], ["la", 21.38], ["meta", 21.49, 1]] },
        { a: 21.6, b: 22.2, w: [["que", 21.6], ["va", 21.75], ["a", 21.86], ["construir", 21.97]] },
        { a: 22.2, b: 23.16, w: [["desde", 22.2], ["el", 22.57], ["día", 22.72], ["de", 22.86], ["hoy", 22.97, 1]] },
        { a: 23.16, b: 24.31, w: [["es", 23.16], ["trabajar", 23.72], ["el", 24.0], ["Loovo", 24.18, 1]] },
        { a: 24.31, b: 25.17, w: [["para", 24.31], ["mostrar", 24.55], ["una", 24.77], ["empresa", 24.95]] },
        { a: 25.17, b: 26.08, g: 1, w: [["totalmente", 25.17, 1], ["diferente", 25.61, 1]] },
        { a: 26.15, b: 27.1, w: [["Voy", 26.15], ["a", 26.41], ["llegar", 26.53], ["a", 26.73], ["tener", 26.89]] },
        { a: 27.1, b: 27.98, w: [["los", 27.1], ["mejores", 27.34, 1], ["servicios", 27.6]] },
        { a: 27.98, b: 28.3, w: [["del", 27.98], ["evento", 28.12, 1]] },
        { a: 34.9, b: 35.21, w: [["Y", 34.9], ["quiero", 34.95], ["que", 35.07]] },
        { a: 35.21, b: 36.01, w: [["me", 35.21], ["acompañen", 35.29, 1]] },
        { a: 36.01, b: 36.86, w: [["a", 36.01], ["ver", 36.15], ["qué", 36.31], ["tan", 36.48], ["lejos", 36.66, 1]] },
        { a: 36.86, b: 37.38, w: [["puedo", 36.86], ["llevar", 37.06]] },
        { a: 37.38, b: 38.13, w: [["esta", 37.38], ["empresa", 37.75, 1]] },
      ];

      // ---------- Construcción del DOM (determinista) ----------
      const capsEl = document.getElementById("caps");
      CAPS.forEach((c, i) => {
        const d = document.createElement("div");
        d.className = "cap";
        d.id = "cap" + i;
        c.w.forEach(([txt, , kw], j) => {
          const s = document.createElement("span");
          s.className = "w" + (kw ? " kw" : "");
          s.id = `cap${i}w${j}`;
          s.textContent = txt;
          d.appendChild(s);
        });
        if (c.u) {
          const u = document.createElement("div");
          u.className = "uline";
          u.id = `cap${i}u`;
          d.appendChild(u);
        }
        capsEl.appendChild(d);
      });
      const lat = document.getElementById("lattice");
      for (let i = 0; i < 70; i++) lat.appendChild(document.createElement("div"));
      const segs = document.getElementById("segs");
      for (let i = 0; i < 42; i++) {
        const s = document.createElement("div");
        if (i === 0) s.id = "seg0";
        segs.appendChild(s);
      }

      // ---------- Timeline ----------
      gsap.set("#wipe-red", { scale: 0 });
      // Los tiempos de abajo se escribieron sobre el corte anterior; T() los
      // lleva al corte actual (bordes ajustados a fotograma, plan/timemap.json).
      const MAP_OLD = [0, 3.89, 7.2, 10.21, 14.78, 18.68, 20.61, 26.11, 32.53, 34.69, 38.14];
      const MAP_NEW = [0, 3.857, 7.178, 10.178, 14.749, 18.634, 20.557, 26.057, 32.48, 34.634, 38.057];
      const T = (t) => {
        let i = 1;
        while (i < MAP_OLD.length - 1 && t > MAP_OLD[i]) i++;
        const [a, b, c, d] = [MAP_OLD[i - 1], MAP_OLD[i], MAP_NEW[i - 1], MAP_NEW[i]];
        return c + ((t - a) * (d - c)) / (b - a);
      };
      const root = gsap.timeline({ paused: true });
      const tl = {
        to: (s, v, p) => root.to(s, v, T(p)),
        fromTo: (s, a, b, p) => root.fromTo(s, a, b, T(p)),
        set: (s, v, p) => root.set(s, v, T(p)),
      };
      const show = (sel, t) => tl.set(sel, { visibility: "visible" }, t);
      const hide = (sel, t) => tl.set(sel, { visibility: "hidden" }, t);
      const blurIn = (sel, t, extra = {}) =>
        tl.fromTo(sel, { opacity: 0, y: 26, scale: 0.92, filter: "blur(14px)" },
          { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "power3.out", ...extra }, t);
      const slam = (sel, t, from = 1.5) =>
        tl.fromTo(sel, { opacity: 0, scale: from, filter: "blur(10px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.34, ease: "expo.out" }, t);

      // Subtítulos: palabra a palabra con blur-in; la frase sale hacia arriba
      CAPS.forEach((c, i) => {
        show("#cap" + i, c.a);
        c.w.forEach(([, t, kw], j) => {
          const sel = `#cap${i}w${j}`;
          if (kw) tl.fromTo(sel, { opacity: 0, scale: 1.45, filter: "blur(12px)" },
            { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "back.out(2)" }, t);
          else blurIn(sel, t, { duration: 0.24 });
        });
        if (c.u) tl.to(`#cap${i}u`, { scaleX: 1, duration: 0.3, ease: "power3.out" }, c.u);
        if (c.g) {
          // glitch RGB en "totalmente diferente"
          const g = [
            "4px 0 0 #00e5ff, -4px 0 0 #e3120b", "-9px 2px 0 #00e5ff, 8px -2px 0 #e3120b",
            "6px -3px 0 #00e5ff, -6px 3px 0 #e3120b", "0 0 22px rgba(255,255,255,0.95)",
          ];
          [0, 0.06, 0.12, 0.2, 0.44, 0.5, 0.58].forEach((dt, k) =>
            tl.set(`#cap${i} .w`, { textShadow: g[k % 4], x: k % 2 ? -6 : 6 }, c.a + dt));
          tl.set(`#cap${i} .w`, { textShadow: g[3], x: 0 }, c.a + 0.66);
        }
        tl.to("#cap" + i, { opacity: 0, y: -24, filter: "blur(8px)", duration: 0.14, ease: "power2.in" }, c.b - 0.14);
        hide("#cap" + i, c.b);
      });

      // ---------- S1 · Gancho 0–1.85 ----------
      gsap.set("#s1", { clipPath: "circle(150% at 50% 42%)" });
      blurIn("#s1-tengo", 0, { duration: 0.2 });
      tl.fromTo("#odo", { opacity: 0, scale: 1.3 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 0.1);
      tl.to("#d-tens", { y: -4 * 430, duration: 0.6, ease: "power4.out" }, 0.1);
      tl.to("#d-ones", { y: -12 * 430, duration: 0.7, ease: "power4.out" }, 0.1);
      tl.fromTo("#s1-dias", { opacity: 0, x: 260, filter: "blur(14px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 0.8);
      blurIn("#s1-para", 1.12);
      tl.to("#s1 .glow", { scale: 1.25, opacity: 0.6, duration: 0.25, yoyo: true, repeat: 1 }, 0.42);
